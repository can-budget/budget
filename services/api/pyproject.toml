[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "can-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "PyJWT[crypto]>=2.10,<3", "cryptography>=44", "httpx[http2]>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "httpx>=0.28", "ruff>=0.9", "mypy>=1.14", "PyYAML>=6", "jsonschema>=4.23", "rfc3339-validator>=0.1.4"]

[tool.setuptools.packages.find]
include = ["can_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires an explicitly supplied TEST_DATABASE_URL and isolated PostgreSQL database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["can_api"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
