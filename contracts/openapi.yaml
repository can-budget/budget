    delete:
      operationId: profile_delete
      summary: Delete the account while preserving shared financial history without attribution
      description: >-
        First acceptance requires a valid app session, fresh Apple reauthentication
        and explicit confirmation. Acceptance revokes app and widget access and schedules
        durable erasure of identity, credentials and attribution in shared audit data.
        Financial amounts, dates, corrections and carry decisions remain unchanged.
        Completion requires the independent recovery journal and Apple revocation workflow.
        The client persists the command ID, body and original X-Reauth-Token before sending.
        An exact retry with that original proof returns the same accepted response even
        after session revocation; this exception cannot create another deletion job or
        read any budget data. A 401 alone is never evidence of accepted deletion.
        Logout and leaving a cabinet are separate operations.
      tags:
      - profile
      responses:
        '202':
          description: Deletion durably accepted, not proof that asynchronous erasure has completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionAccepted'
        '400':
          description: Structured failure. Preserve pending command on unknown outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Structured failure. Preserve pending command on unknown outcome.
          content:
