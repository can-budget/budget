      - inviter_name
      - available_slots
      - expires_at
      - member_count
      additionalProperties: false
    CommandResult:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - applied
        result_revision:
          anyOf:
          - type: integer
            format: int64
            minimum: 0
          - type: 'null'
        entity_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        invitation:
          anyOf:
          - $ref: '#/components/schemas/Invitation'
