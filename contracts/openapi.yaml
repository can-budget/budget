              format: uuid
            sprint_id:
              type: string
              format: uuid
            kind:
              type: string
              enum:
              - expense
              - topup
            amount_minor:
              type: integer
              format: int64
              minimum: 1
              maximum: 999999999
            occurred_at:
              type: string
              format: date-time
            allow_completed:
              type: boolean
              default: false
            membership_id:
              type: string
              format: uuid
              description: Membership epoch that created the intent. Leaving and rejoining
                creates a different epoch.
            recovery_of_command_id:
              type: string
              format: uuid
              description: A rejected add_entry command whose explicit recovery is
                being requested under a new command_id.
            original_occurred_at:
              type: string
              format: date-time
              description: Original timestamp retained when the user explicitly changes
                the business day after rejection.
          required:
          - entry_id
          - sprint_id
          - kind
          - amount_minor
          - occurred_at
          - allow_completed
          - membership_id
          additionalProperties: false
          dependentRequired:
            original_occurred_at:
            - recovery_of_command_id
      required:
      - command_id
      - type
      - payload
      additionalProperties: false
