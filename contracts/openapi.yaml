    CommandReceipt:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - applied
          - rejected
          - unknown
        result_revision:
          anyOf:
          - type: integer
            format: int64
            minimum: 0
          - type: 'null'
        result:
          anyOf:
          - $ref: '#/components/schemas/CommandResult'
          - type: 'null'
        error:
          anyOf:
          - $ref: '#/components/schemas/Error'
          - type: 'null'
      required:
      - command_id
      - status
      - result_revision
      - result
      - error
      additionalProperties: false
      oneOf:
      - properties:
          status:
            const: applied
          result:
            $ref: '#/components/schemas/CommandResult'
          error:
            type: 'null'
      - properties:
          status:
            const: rejected
          result_revision:
            type: 'null'
          result:
            type: 'null'
          error:
            $ref: '#/components/schemas/Error'
      - properties:
          status:
            const: unknown
          result_revision:
            type: 'null'
          result:
            type: 'null'
          error:
            type: 'null'
    SyncRequest:
