          description: Structured failure. Preserve pending command on unknown outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - session: []
      parameters:
      - name: cabinet_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sprint_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/commands/{command_id}/receipt:
    get:
      operationId: own_command_receipt
      summary: Read the current user receipt without replaying a command
      description: May be used after leaving a cabinet or changing membership epoch.
        Never re-executes the command or exposes a cabinet snapshot. Invitation secrets
        are omitted. Unknown does not prove that an in-flight request will never arrive.
      tags:
      - entry
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '400':
          description: Structured failure. Preserve pending command on unknown outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Structured failure. Preserve pending command on unknown outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Structured failure. Preserve pending command on unknown outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Structured failure. Preserve pending command on unknown outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Structured failure. Preserve pending command on unknown outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Structured failure. Preserve pending command on unknown outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Structured failure. Preserve pending command on unknown outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 1
              description: Seconds before retry
        '503':
          description: Structured failure. Preserve pending command on unknown outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - session: []
      parameters:
      - name: command_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: App session only; not Apple identity token.
    widget:
      type: http
      scheme: bearer
      description: Read-only token scoped to one cabinet/device.
    deletionReplay:
      type: apiKey
      in: header
      name: X-Reauth-Token
      description: Only replays an already accepted deletion with its exact command ID and body; cannot authorize a new request.
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
          format: uuid
        retryable:
          type: boolean
        details:
          type: object
          properties: {}
          required: []
          additionalProperties: true
      required:
      - code
      - message
      - request_id
      - retryable
      - details
      additionalProperties: false
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 40
        active_cabinet_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        active_membership_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
      required:
      - id
      - display_name
      - active_cabinet_id
      - active_membership_id
      additionalProperties: false
    Member:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        joined_at:
          type: string
          format: date-time
        membership_id:
          type: string
          format: uuid
      required:
      - user_id
      - display_name
      - joined_at
      - membership_id
      additionalProperties: false
    Cabinet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 40
        timezone:
          type: string
          const: Asia/Shanghai
        revision:
          type: integer
          format: int64
          minimum: 0
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
          maxItems: 10
          minItems: 1
      required:
      - id
      - name
      - timezone
      - revision
      - members
      additionalProperties: false
    Sprint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        initial_minor:
          type: integer
          format: int64
          minimum: 1
          maximum: 999999999
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        calculation_version:
          type: integer
          format: int64
          enum: [2, 3]
        topups_today_from:
          description: Version 3 adds each topup fully to its effective day from this date; earlier days retain version 2 arithmetic.
          anyOf:
          - type: string
            format: date
          - type: 'null'
        closed_at:
          description: Explicit completion time. A completed budget stays in history with its original planned end date.
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        status:
          type: string
          enum:
          - active
          - completed
        initial_end_date:
          type: string
          format: date
          description: Immutable original end date. end_date is the current effective
            end date; use sprint_revisions to replay historical days.
      required:
      - id
      - initial_minor
      - start_date
      - end_date
      - calculation_version
      - status
      - initial_end_date
      additionalProperties: false
      allOf:
      - if:
          properties:
            calculation_version: {const: 3}
        then:
          required: [topups_today_from]
          properties:
            topups_today_from: {type: string, format: date}
    DayAggregate:
      type: object
      properties:
        day:
          type: string
          format: date
        topups_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 9000000000000
        expenses_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 9000000000000
      required:
      - day
      - topups_minor
      - expenses_minor
      additionalProperties: false
    CarryDecision:
      type: object
      properties:
        day:
          type: string
          format: date
        mode:
          type: string
          enum:
          - today
          - distribute
        actor_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        basis_revision:
          type: integer
          format: int64
          minimum: 0
        decided_at:
          type: string
          format: date-time
      required:
      - day
      - mode
      - actor_id
      - basis_revision
      - decided_at
      additionalProperties: false
    Projection:
      type: object
      properties:
        status:
          type: string
          enum:
          - active
          - completed
        bank_minor:
          type: integer
          format: int64
          minimum: -9000000000000
          maximum: 9000000000000
        today_remaining_minor:
          anyOf:
          - type: integer
            format: int64
            minimum: -9000000000000
            maximum: 9000000000000
          - type: 'null'
        days_remaining:
          type: integer
          format: int64
          minimum: 0
          maximum: 366
        carry_minor:
          type: integer
          format: int64
          minimum: 0
        carry_status:
          type: string
          enum:
          - none
          - pending
          - selected_today
          - selected_distribute
          - auto_distribute
        today_mode_remaining_minor:
          anyOf:
          - type: integer
            format: int64
            minimum: -9000000000000
            maximum: 9000000000000
          - type: 'null'
        distribute_remaining_minor:
          anyOf:
          - type: integer
            format: int64
            minimum: -9000000000000
            maximum: 9000000000000
          - type: 'null'
      required:
      - status
      - bank_minor
      - today_remaining_minor
      - days_remaining
      - carry_minor
      - carry_status
      - today_mode_remaining_minor
      - distribute_remaining_minor
      additionalProperties: false
    Snapshot:
      type: object
      properties:
        server_time:
          type: string
          format: date-time
        business_date:
          type: string
          format: date
        cabinet_revision:
          type: integer
          format: int64
          minimum: 0
        cabinet:
          $ref: '#/components/schemas/Cabinet'
        sprint:
          anyOf:
          - $ref: '#/components/schemas/Sprint'
          - type: 'null'
        daily_totals:
          type: array
          items:
            $ref: '#/components/schemas/DayAggregate'
          maxItems: 366
        carry_decisions:
          type: array
          items:
            $ref: '#/components/schemas/CarryDecision'
          maxItems: 366
        projection:
          anyOf:
          - $ref: '#/components/schemas/Projection'
          - type: 'null'
        sprint_revisions:
          type: array
          items:
            $ref: '#/components/schemas/SprintRevision'
      required:
      - server_time
      - business_date
      - cabinet_revision
      - cabinet
      - sprint
      - daily_totals
      - carry_decisions
      - projection
      - sprint_revisions
      additionalProperties: false
    Entry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sprint_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - expense
          - topup
        amount_minor:
          type: integer
          format: int64
          minimum: 1
          maximum: 999999999
        occurred_at:
          type: string
          format: date-time
        effective_day:
          type: string
          format: date
        received_at:
          type: string
          format: date-time
        author_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        last_editor_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        revision:
          type: integer
          format: int64
          minimum: 1
        deleted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        author_name:
          type:
          - string
          - 'null'
        last_editor_name:
          type:
          - string
          - 'null'
      required:
      - id
      - sprint_id
      - kind
      - amount_minor
      - occurred_at
      - effective_day
      - received_at
      - author_id
      - last_editor_id
      - revision
      - deleted_at
      - author_name
      - last_editor_name
      additionalProperties: false
    EntryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
        observed_cabinet_revision:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - next_cursor
      - observed_cabinet_revision
      additionalProperties: false
    SprintPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Sprint'
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    ArchivedProjection:
      type: object
      properties:
        server_time:
          type: string
          format: date-time
        cabinet_revision:
          type: integer
          format: int64
          minimum: 0
        sprint:
          $ref: '#/components/schemas/Sprint'
        daily_totals:
          type: array
          items:
            $ref: '#/components/schemas/DayAggregate'
        carry_decisions:
          type: array
          items:
            $ref: '#/components/schemas/CarryDecision'
        projection:
          $ref: '#/components/schemas/Projection'
        sprint_revisions:
          type: array
          items:
            $ref: '#/components/schemas/SprintRevision'
      required:
      - server_time
      - cabinet_revision
      - sprint
      - daily_totals
      - carry_decisions
      - projection
      - sprint_revisions
      additionalProperties: false
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{10}$
        expires_at:
          type: string
          format: date-time
        environment:
          type: string
          enum:
          - staging
          - production
