# First HTTPS setup before Apple and database credentials are provisioned.
# Uses the production project, service and volumes, not a second ingress stack.
name: can-production

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      CAN_DOMAIN: ${CAN_DOMAIN:?Set the public API IPv4 address or DNS hostname}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  edge: {}

volumes:
  caddy_data: {}
  caddy_config: {}
