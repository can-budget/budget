name: ${CAN_RESTORE_PROJECT:?Choose a new can-restore-* project}
services:
  restore-db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: can_restore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/restore_database_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [restore_database_password]
    volumes:
      - restore_data:/var/lib/postgresql
    networks: [isolated]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d can_restore"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
secrets:
  restore_database_password:
    file: ${CAN_RESTORE_ADMIN_PASSWORD_FILE:?Set an isolated restore password file}
volumes:
  restore_data: {}
networks:
  isolated:
    internal: true
