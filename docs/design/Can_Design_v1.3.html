  function history(st=s,archive=false){const list=archive?[{id:101,author:'Аня',amount:60000,kind:'expense',time:'19:20'},{id:102,author:'Егор',amount:15000,kind:'expense',time:'15:05'}]:st.entries;return `${nav(archive?'10–19 октября':'Операции',archive?'archive':'home',btn('Кабинет','go:settings','text-link'))}<div class="scroll-body"><div class="list-head">${archive?'19 ОКТЯБРЯ':'СЕГОДНЯ, 20 ОКТЯБРЯ'}</div>${list.length?list.slice().reverse().map(x=>`<button class="entry-row" data-act="${archive?'readonly':`entry:${x.id}`}"><span><strong${x.kind!=='expense'?' class="positive"':''}>${x.kind==='expense'?'−':x.amount>=0?'+':'−'}${f(Math.abs(x.amount))}</strong><small>${e(x.author)} · ${x.kind==='adjust'?'Корректировка':x.time}${x.pending?' · в очереди':''}</small></span>${icon('more',20)}</button>`).join(''):'<p class="secondary">Пока нет операций</p>'}</div>`}
  function form(st=s){const a=financial(st),n=st.draftDays,amount=parse(st.draft);const C=st.carryMode==='today'?st.carry:0;const preview=amount===null?null:st.newBudget?Math.floor(amount/n):C+Math.floor((st.opening-C)/n)+Math.floor((a.income+amount-a.bank)/n)-a.expenses;return `<div class="in-phone-top">${btn('Отменить','go:home','')}${topAction('Сохранить','save-budget',amount===null||(st.newBudget&&amount<=0))}</div><div class="scroll-body"><div class="form-hero"><label><span>${st.newBudget?'Сумма':'Остаток сейчас'}</span><input data-field="budget-amount" value="${e(st.draft)}" inputmode="decimal" aria-label="${st.newBudget?'Сумма':'Текущий остаток бюджета'}"></label><small>${preview===null?'—':f(preview)} ${st.newBudget?'в первый день':'на сегодня'}</small></div><button class="duration" data-act="sheet:date"><span>Срок</span><strong>по ${dateText(iso('2026-10-20',n-1))}${icon('chevron',15)}</strong></button><p class="tiny-note">${n} ${dw(n)}, включая сегодня.${st.newBudget?'':'<br>История покупок сохранится.'}</p>${st.error?`<p class="error-text">${e(st.error)}</p>`:''}</div><div class="bottom-action">${btn('Кабинет и участники','go:settings','text-link')}</div>`}
  function row(title,act,right=''){return btn(`<span>${title}</span><span class="list-right">${right?`<small>${right}</small>`:''}${icon('chevron',15)}</span>`,act,'list-row')}
  function body(page,st=s){if(page==='home')return minimalMain(st);if(page==='budget')return form(st);if(page==='history')return history(st);if(page==='archive-detail')return history(st,true).replace('10–19 октября',st.selectedArchive===1?'1–9 октября':'10–19 октября').replace('19 ОКТЯБРЯ',st.selectedArchive===1?'9 ОКТЯБРЯ':'19 ОКТЯБРЯ');if(page==='login')return `<div class="auth-center"><div class="big-wordmark">Можно</div><p>Один бюджет.<br>На каждый день.</p></div><div class="bottom-action">${btn(`${apple}Войти с Apple`,'apple','primary apple-button')}<p class="center-note">${btn('Об использовании данных','sheet:privacy','text-link')}</p></div>`;
    if(page==='choose')return `${nav('','login')}<div class="scroll-body"><h1>Начнём?</h1><p class="secondary">Создайте кабинет или присоединитесь к общему.</p>${btn(`<span><b>Создать кабинет</b><small>Начать одному или вместе</small></span>${icon('chevron',20)}`,'go:cabinet','choice-row')}${btn(`<span><b>Присоединиться</b><small>По коду или QR</small></span>${icon('chevron',20)}`,'go:join','choice-row')}</div><div class="bottom-action"><p class="center-note">До 10 человек · одинаковые права</p></div>`;
    if(page==='cabinet')return `${nav('Новый кабинет','choose')}<div class="scroll-body"><h1>Как назовём?</h1><label class="field"><span>Название</span><input data-field="cabinet-name" value="${e(st.name)}" maxlength="32"></label><p class="tiny-note">Пригласить людей можно позже.</p></div><div class="bottom-action">${btn('Создать','create-cabinet','primary',!st.name.trim())}</div>`;
    if(page==='join')return `${nav('Приглашение','choose')}<div class="scroll-body"><h1>Войдём вместе</h1><p class="secondary">Введите код, который вам отправили.</p><label class="field"><span>Код приглашения</span><input data-field="code" value="${e(st.code)}" placeholder="XXXX-XXXX-XX" maxlength="16" autocapitalize="characters"></label>${st.error?`<p class="error-text">${e(st.error)}</p>`:''}${btn('Продолжить','join','primary',!st.code.trim())}${btn('Сканировать QR','go:scan','secondary-button')}${btn('Подставить демо-код','demo-code','text-link')}</div>`;
    if(page==='preview')return `${nav('Приглашение','join')}<div class="auth-center"><span class="eyebrow">ВАС ПРИГЛАШАЮТ</span><h1>${e(st.name)}</h1><p>2 из 10 участников.<br>У всех одинаковые права.</p></div><div class="bottom-action">${btn('Присоединиться','accept','primary')}</div>`;
    if(page==='invite')return `${nav('Пригласить','members')}<div class="qr-bright"><div class="qr-block">${qrMarkup}</div>${btn(`K7M9-X2RP-Q4 ${icon('copy',18)}`,'copy-code','invite-code',false,'aria-label="Скопировать код"')}<p class="center-note" style="color:#797981">24 часа · одно подключение</p></div><div class="bottom-action">${btn('Скопировать код','copy-code')}${btn('Поделиться QR и кодом','share','secondary-button')}</div>`;
    if(page==='scan')return `${nav('Сканировать','join')}<div class="scroll-body"><div class="scan-window"><div><div class="qr-block">${qrMarkup}</div><span class="scan-line"></span></div></div><p class="secondary" style="text-align:center">Наведите камеру на приглашение.</p></div><div class="bottom-action">${btn('Сканировать · демо','go:preview')}${btn('Ввести код','go:join','secondary-button')}</div>`;
    if(page==='settings')return `${nav('Кабинет','home')}<div class="scroll-body"><h1>${e(st.name)}</h1><p class="secondary">2 участника · равные права</p>${row('Участники','go:members','2 / 10')}${row('Пригласить','go:invite')}${row('Название','sheet:rename')}<div class="list-head">БЮДЖЕТ</div>${row('Сумма и срок','go:budget')}${row('Прошлые бюджеты','go:archive')}${row('Синхронизация','sheet:sync',st.state==='offline'?'Нет связи':'')}<div class="list-head">ЛИЧНОЕ</div>${row('Профиль','go:profile')}${row('Выйти из кабинета','sheet:leave')}</div>`;
    if(page==='members')return `${nav('Участники','settings')}<div class="scroll-body"><h1>Наши люди</h1><p class="secondary">2 из 10</p>${[st.username,'Аня'].map((n,i)=>`<div class="list-row"><span>${e(n)}${i===0?' · вы':''}</span><small>Участник</small></div>`).join('')}<p class="tiny-note">Все управляют одним бюджетом.</p></div><div class="bottom-action">${btn('Пригласить','go:invite')}</div>`;
    if(page==='profile')return `${nav('Профиль','settings')}<div class="scroll-body"><h1>${e(st.username)}</h1><p class="secondary">Вход через Apple</p><label class="field"><span>Имя</span><input data-field="username" maxlength="24" value="${e(st.username)}"></label>${btn('Сохранить','save-profile','primary',!st.username.trim())}<div class="list-head">ДОСТУП</div>${row('Выйти из кабинета','sheet:leave')}${row('Выйти из аккаунта','go:login')}${row('Удалить аккаунт','sheet:account-delete')}</div>`;

    if(page==='finish')return `<div class="finish-content"><span class="eyebrow">СРОК ЗАКОНЧИЛСЯ</span><h1>Ура,<br>получилось!</h1><span class="fine">И ещё осталось</span><strong class="result-number">1 250</strong></div><div class="bottom-action">${btn('Новый бюджет','new-budget')}${btn('Посмотреть историю','go:archive','secondary-button')}</div>`;
    if(page==='empty')return `<div class="auth-center"><h1>Сколько<br>и до когда?</h1><p>Задайте сумму и срок.<br>Мы посчитаем на сегодня.</p></div><div class="bottom-action">${btn('Задать бюджет','new-budget')}${btn('Пригласить','go:invite','secondary-button')}</div>`;
    if(page==='expired'||page==='full')return `${nav('','join')}<div class="auth-center"><h1>${page==='full'?'Мест пока нет':'Код не действует'}</h1><p>${page==='full'?'В кабинете уже 10 человек.':'Попросите новое приглашение.<br>Этот код истёк или уже использован.'}</p></div><div class="bottom-action">${btn(page==='full'?'Назад':'Ввести другой код','go:join')}</div>`;return minimalMain(st);
  }
  function sheet(which,st=s){const a=financial(st),x=st.entries.find(x=>x.id===st.selected)||st.entries[0];const wrap=(title,content)=>`<div class="sheet-scrim" data-backdrop="true"><section class="phone-sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="grabber"></div><div class="sheet-nav"><span class="sheet-title">${title}</span>${btn(icon('close',17),'close-sheet','',false,'aria-label="Закрыть окно"')}</div>${content}</section></div>`;
    if(which==='carry'){const C=st.carry||40000,bank=st.carry? a.bank:940000,n=st.carry?st.days:9;const today=C+Math.floor((bank-C)/n),spread=Math.floor(bank/n);return wrap('Новый день',`<p class="carry-caption">Вчера осталось</p><div class="carry-large">${f(C)}</div>${[['today','Оставить на сегодня',today],['spread','Распределить по дням',spread]].map(([v,t,val])=>btn(`<span><b>${t}</b>${v==='spread'?'<small>Уже учтено автоматически</small>':''}</span><span class="choice-end"><strong>${f(val)}</strong><i class="radio">${st.choice===v?icon('check',13):''}</i></span>`,`carry-choice:${v}`,`carry-choice${st.choice===v?' on':''}`)).join('')}<p class="sheet-note">В банке те же ${f(bank)}. Выбор — общий.</p>${btn('Готово','confirm-carry','primary',st.state==='offline')}`)}
    if(which==='date')return wrap('Выберите срок',`<div class="date-list">${Array.from({length:31},(_,i)=>i+1).map(n=>btn(`<span class="date-check">${n===st.draftDays?icon('check',16):''}</span><span>${n===1?'Сегодня':dateText(iso('2026-10-20',n-1))} — ${n} ${dw(n)}</span>`,`days:${n}`,n===st.draftDays?'active':'')).join('')}</div><label class="tiny-note">Другая дата<input class="date-native" data-field="native-date" type="date" min="2026-10-20" max="2027-10-20" value="${iso('2026-10-20',st.draftDays-1)}"></label>`);
    if(which==='entry')return wrap('Изменить сумму',`<p class="sheet-note">${e(x?.author||'Аня')} · ${x?.time||'11:40'}</p><input class="sheet-input" aria-label="Сумма операции" data-field="entry-amount" inputmode="decimal" value="${e(st.entryDraft)}">${st.error?`<p class="error-text">${e(st.error)}</p>`:''}${btn('Сохранить','save-entry','primary',st.state==='offline')}${btn('Удалить','sheet:delete','secondary-button')}`);
    if(which==='delete')return wrap('Удалить операцию?',`<p class="carry-caption">${e(x?.author||'Аня')}</p><div class="carry-large">${x?.kind==='expense'?'−':(x?.amount||0)<0?'−':'+'}${f(Math.abs(x?.amount||18000))}</div><p class="sheet-note">Общий остаток пересчитается. Запись не исчезнет из журнала изменений.</p>${btn('Удалить','delete-entry','primary danger-button',st.state==='offline')}${btn('Не удалять','sheet:entry','secondary-button')}`);
    if(which==='sync')return wrap(st.state==='offline'?'Нет связи':'Синхронизация',`<p class="sheet-note">${st.state==='offline'?'Покупки сохраняются на этом телефоне. Другие участники увидят их после отправки.':'В продукте обновления проверяются на сервере. Здесь показан демонстрационный статус.'}</p><div class="list-row"><span>В очереди</span><span>${st.entries.filter(x=>x.pending).length}</span></div>${btn('Синхронизировать · демо','sync')}`);
    if(which==='conflict')return wrap('Бюджет изменился',`<p class="sheet-note">Пока вы редактировали, Аня записала 500. Ваш ввод сохранён.</p><p class="carry-caption">Ваш остаток</p><div class="carry-large">${e(st.draft)}</div><p class="sheet-note">Обновите расчёт и проверьте результат перед сохранением.</p>${btn('Проверить расчёт','resolve-conflict')}`);
    if(which==='rename')return wrap('Название кабинета',`<input class="sheet-input" data-field="cabinet-name" aria-label="Название кабинета" maxlength="32" value="${e(st.name)}">${btn('Сохранить','close-sheet','primary',!st.name.trim())}`);
    if(which==='leave')return wrap('Выйти из кабинета?',`<p class="sheet-note">Вы потеряете доступ к «${e(st.name)}». Ваши операции останутся в общей истории.</p>${st.entries.some(x=>x.pending)?'<p class="error-text">Сначала отправьте операции из очереди.</p>':''}${btn('Выйти','leave','primary danger-button',st.entries.some(x=>x.pending))}${btn('Остаться','close-sheet','secondary-button')}`);
    if(which==='account-delete')return wrap('Удаление аккаунта',`<p class="sheet-note">В этом макете ничего не удаляется. Для продукта ещё нужно утвердить политику хранения общей финансовой истории после удаления участника.</p>${btn('Понятно','close-sheet')}`);
    if(which==='privacy')return wrap('О макете',`<p class="sheet-note">Это интерактивный дизайн-проект. Apple-вход, сервер, синхронизация и камера здесь не подключены. Используйте только демонстрационные данные.</p>${btn('Понятно','close-sheet')}`);return '';
  }
  function appPhone(page=s.page,st=s,which=s.sheet){return device(`<div class="app-body">${body(page,st)}</div>${which?sheet(which,st):''}`,{cls:'app-slot'})}
  function go(page){s.sheet=null;s.error='';if(page==='budget'){s.newBudget=false;s.draft=String(financial().bank/100).replace('.',',');s.draftDays=s.days} if(['carry','date','edit','delete','conflict'].includes(page)){const map={carry:'carry',date:'date',edit:'entry',delete:'delete',conflict:'conflict'};s.sheet=map[page];s.page=['edit','delete'].includes(page)?'history':page==='date'?'budget':'home';if(page==='carry')Object.assign(s,seed('newday'),{sheet:'carry',choice:'spread'});if(page==='date'){s.draftDays=s.days;s.draft=String(financial().bank/100).replace('.',',')}if(page==='edit'||page==='delete'){const x=s.entries.at(-1);if(x){s.selected=x.id;s.entryDraft=String(x.amount/100).replace('.',',')}}}else s.page=page}
  function app(){const id=s.sheet==='entry'?'edit':s.sheet&&['carry','date','delete','conflict'].includes(s.sheet)?s.sheet:s.page;const meta=screens.find(x=>x[0]===id)||screens[0];return `<div class="intro"><div><span class="eyebrow">ПРИЛОЖЕНИЕ</span><h1>Меньше интерфейса.<br>Больше ясности.</h1></div><p>Основное действие — в одном экране.<br>Остальное — по необходимости.</p></div><div class="app-layout"><aside class="app-nav">${['Основное','Подключение','Настройки','Состояния','Окна'].map(g=>`<h3>${g}</h3>${screens.filter(x=>x[2]===g).map(([v,t],i)=>btn(`<span>${t}</span><small>${String(screens.findIndex(x=>x[0]===v)+1).padStart(2,'0')}</small>`,`select:${v}`,id===v?'on':'')).join('')}`).join('')}</aside><main>${appPhone()}</main><aside class="review-panel"><span class="eyebrow">НА РЕВЬЮ</span><h2>${meta[1]}</h2><p>${meta[3]}</p><div class="test-pills">${[['normal','Обычно'],['newday','Новый день'],['overdrawn','Перерасход'],['offline','Нет связи']].map(([v,t])=>btn(t,`app-state:${v}`,s.state===v?'on':'')).join('')}</div>${btn('Сбросить демонстрацию','reset','review-action')}<label>Замечание к экрану<textarea data-field="note" data-note-id="${id}" placeholder="Что поменять в этом экране?">${e(s.notes[id]||'')}</textarea></label><p class="small">Замечания хранятся только в этом браузере и не отправляются автоматически.</p>${btn('Скопировать замечания','copy-notes','review-action')}<p class="footnote">Демонстрационные числа. Изменения в макете не затрагивают реальный бюджет. Никаких новых категорий или способов авторизации.</p></aside></div>`}
  function gallery(){return `<div class="intro"><div><span class="eyebrow">КАРТА ИНТЕРФЕЙСА</span><h1>Пять основных экранов.<br>Остальное — по делу.</h1></div><p>Окна не превращаем в отдельные маршруты.<br>Нажмите подпись, чтобы пройти сценарий.</p></div><div class="gallery"><div class="gallery-filters">${['Все','Основное','Подключение','Настройки','Состояния','Окна'].map(x=>btn(x,`filter:${x}`,s.filter===x?'on':'')).join('')}</div><div class="gallery-grid">${screens.filter(x=>s.filter==='Все'||x[2]===s.filter).map(([id,t,g])=>{let st={...s,...seed(),draft:'36370',draftDays:10,entryDraft:'180',choice:'spread'},page=id,sh=null;if(g==='Окна'){page=['edit','delete'].includes(id)?'history':id==='date'?'budget':'home';sh=id==='edit'?'entry':id;if(id==='carry')st={...st,...seed('newday')}}return `<article class="gallery-card">${appPhone(page,st,sh)}${btn(`<span>${t}</span><small>${g}</small>`,`select:${id}`,'gallery-title')}</article>`}).join('')}</div></div>`}
