      - $ref: '#/components/schemas/AddEntryCommand'
      - $ref: '#/components/schemas/CorrectEntryCommand'
      - $ref: '#/components/schemas/VoidEntryCommand'
      - $ref: '#/components/schemas/ChooseCarryCommand'
      - $ref: '#/components/schemas/CreateInvitationCommand'
      - $ref: '#/components/schemas/RevokeInvitationCommand'
      - $ref: '#/components/schemas/RenameCabinetCommand'
      - $ref: '#/components/schemas/LeaveCabinetCommand'
      - $ref: '#/components/schemas/UpdateSprintCommand'
      discriminator:
        propertyName: type
        mapping:
          create_sprint: '#/components/schemas/CreateSprintCommand'
          add_entry: '#/components/schemas/AddEntryCommand'
          correct_entry: '#/components/schemas/CorrectEntryCommand'
          void_entry: '#/components/schemas/VoidEntryCommand'
          choose_carry: '#/components/schemas/ChooseCarryCommand'
          create_invitation: '#/components/schemas/CreateInvitationCommand'
          revoke_invitation: '#/components/schemas/RevokeInvitationCommand'
          rename_cabinet: '#/components/schemas/RenameCabinetCommand'
          leave_cabinet: '#/components/schemas/LeaveCabinetCommand'
          update_sprint: '#/components/schemas/UpdateSprintCommand'
    SprintRevision:
      type: object
      additionalProperties: false
      properties:
        id: &id010
          type: string
          format: uuid
        sprint_id: *id010
        sequence:
          type: integer
          minimum: 1
        effective_day: &id012
          type: string
          format: date
        bank_adjustment_minor: &id011
          type: integer
          format: int64
          minimum: -9000000000000
          maximum: 9000000000000
        bank_before_minor: *id011
        bank_after_minor: *id011
        end_date_before: *id012
        end_date_after: *id012
        basis_revision:
          type: integer
          minimum: 0
        actor_id:
          anyOf:
          - *id010
          - type: 'null'
        created_at:
          type: string
          format: date-time
      required:
      - id
      - sprint_id
      - sequence
      - effective_day
      - bank_adjustment_minor
      - bank_before_minor
      - bank_after_minor
      - end_date_before
      - end_date_after
      - basis_revision
      - actor_id
      - created_at
      description: Immutable accepted configuration change. Delta is computed once
        against the locked confirmed bank. It is not recomputed when a late expense
        arrives. Latest sequence on a day defines its end date. Arithmetic uses initial_end_date
        plus these changes, not current end_date for all historical days.
    UpdateSprintCommand:
      type: object
      additionalProperties: false
      properties:
        command_id: *id010
        type:
          type: string
          const: update_sprint
        payload:
          type: object
          additionalProperties: false
          properties:
            sprint_id: *id010
            expected_cabinet_revision:
              type: integer
              minimum: 0
            expected_business_date: *id012
            bank_minor: *id011
            end_date: *id012
          required:
          - sprint_id
          - expected_cabinet_revision
          - expected_business_date
          anyOf:
          - required:
            - bank_minor
          - required:
            - end_date
          description: Only dirty fields. bank_minor means desired CURRENT confirmed
            bank, never initial budget. Server computes delta atomically. Mismatch
            of revision/date -> 409 with refreshed preview, no write. Date >= current
            business date and <= start+365. Same values -> successful no-op receipt,
            no ledger change.
      required:
      - command_id
      - type
      - payload
