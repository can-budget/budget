components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: App session only; not Apple identity token.
    widget:
      type: http
      scheme: bearer
      description: Read-only token scoped to one cabinet/device.
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        request_id: *id001
        retryable: &id009
          type: boolean
        details:
          type: object
          properties: {}
          required: []
          additionalProperties: true
      required:
      - code
      - message
      - request_id
      - retryable
      - details
      additionalProperties: false
    User:
      type: object
      properties:
        id: *id001
        display_name:
          type: string
          minLength: 1
          maxLength: 40
        active_cabinet_id:
          anyOf:
          - *id001
          - type: 'null'
      required:
      - id
      - display_name
      - active_cabinet_id
      additionalProperties: false
    Member:
      type: object
      properties:
        user_id: *id001
        display_name:
          type: string
        joined_at: &id006
          type: string
          format: date-time
      required:
      - user_id
      - display_name
      - joined_at
      additionalProperties: false
    Cabinet:
      type: object
      properties:
        id: *id001
        name:
          type: string
          minLength: 1
          maxLength: 40
        timezone:
          type: string
        revision: &id005
          type: integer
          format: int64
          minimum: 0
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
          maxItems: 10
          minItems: 1
      required:
      - id
      - name
      - timezone
      - revision
      - members
      additionalProperties: false
    Sprint:
      type: object
      properties:
        id: *id001
        initial_minor: &id008
          type: integer
          format: int64
          minimum: 1
          maximum: 999999999
        start_date: &id004
          type: string
          format: date
        end_date: *id004
        calculation_version:
          type: integer
          format: int64
          const: 2
        status:
          type: string
          enum:
          - active
          - completed
        initial_end_date:
          type: string
          format: date
          description: Immutable original end date. end_date is the current effective
            end date; use sprint_revisions to replay historical days.
      required:
      - id
      - initial_minor
      - start_date
      - end_date
      - calculation_version
      - status
      - initial_end_date
