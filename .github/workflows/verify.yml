name: Verify

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13.16'
      - run: make install
      - run: make verify
      - name: Build backend image
        run: docker build --file infra/Dockerfile --tag can-api:ci .

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: can_test
          POSTGRES_DB: can_test
          # Disposable runner fixture, bound only to loopback. Never used by production Compose.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U can_test -d can_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://can_test@127.0.0.1:5432/can_test
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13.16'
      - run: make install
      - name: PostgreSQL integration tests
        run: make test-postgres

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # The runner default is Xcode 16.4; compile the iOS 26 widget push branch too.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Record SDK versions
        run: |
          xcodebuild -version
          swift --version
      - name: Swift calculation parity
        run: make -C Can_Developer_Handoff_v1.1 swift-check
      - name: Build app and widget without owner credentials
        run: make ios-build
      - name: Run app domain and reconciliation tests
        run: make ios-test
